server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /health, /api/*, and /auth/* to backend.
    # (?:/.*)?$ matches both the bare path (e.g. /health) and any sub-path
    # (e.g. /api/dashboard/today) — a trailing-slash-only match would miss
    # bare /health and /auth/login entirely.
    location ~ ^/(health|api|auth)(?:/.*)?$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}

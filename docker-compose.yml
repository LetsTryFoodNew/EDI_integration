services:
  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: edi_middleware_update
      POSTGRES_USER: edi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edipass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edi -d edi_middleware_update"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── API server ────────────────────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://edi:${POSTGRES_PASSWORD:-edipass}@postgres:5432/edi_middleware_update
      DATABASE_SYNC_URL: postgresql+psycopg2://edi:${POSTGRES_PASSWORD:-edipass}@postgres:5432/edi_middleware_update
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./credentials:/app/credentials
    ports:
      # Host-side port is overridable per-deploy (some hosts already have
      # something on 8000) — container always listens on 8000 internally.
      - "${API_HOST_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Scheduler (APScheduler — triggers RQ jobs on a cron) ─────────────────
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://edi:${POSTGRES_PASSWORD:-edipass}@postgres:5432/edi_middleware_update
      DATABASE_SYNC_URL: postgresql+psycopg2://edi:${POSTGRES_PASSWORD:-edipass}@postgres:5432/edi_middleware_update
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./credentials:/app/credentials
    command: ["python", "-m", "app.workers.scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Worker: ingestion (pulls emails / API / scrapes) ─────────────────────
  worker-ingest:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_SYNC_URL: postgresql+psycopg2://edi:${POSTGRES_PASSWORD:-edipass}@postgres:5432/edi_middleware_update
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./credentials:/app/credentials
    command: ["rq", "worker", "ingest", "--url", "redis://redis:6379/0"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Worker: parsing (raw → canonical EDI document) ───────────────────────
  worker-parse:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_SYNC_URL: postgresql+psycopg2://edi:${POSTGRES_PASSWORD:-edipass}@postgres:5432/edi_middleware_update
      REDIS_URL: redis://redis:6379/0
    command: ["rq", "worker", "parse", "--url", "redis://redis:6379/0"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Worker: SAP push (concurrency 1 — B1 session limits) ─────────────────
  worker-sap:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_SYNC_URL: postgresql+psycopg2://edi:${POSTGRES_PASSWORD:-edipass}@postgres:5432/edi_middleware_update
      REDIS_URL: redis://redis:6379/0
    command: ["rq", "worker", "sap_push", "--url", "redis://redis:6379/0"]
    deploy:
      replicas: 1   # must not scale beyond 1 without checking B1 session pool size
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Worker: outbound documents (855 ACK, 856 ASN, 810 Invoice, credit notes) ─
  # Consumes the "outbound" queue, which the scheduler feeds from three jobs:
  # poll_b1_outbound (ACK trigger, 5m), poll_b1_documents_backup (1h) and
  # retry_pending_outbound (2m). Without this service those jobs pile up unread
  # and nothing ever reaches a retailer — see CHANGELOG 2026-08-20.
  worker-outbound:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_SYNC_URL: postgresql+psycopg2://edi:${POSTGRES_PASSWORD:-edipass}@postgres:5432/edi_middleware_update
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./credentials:/app/credentials
    command: ["rq", "worker", "outbound", "--url", "redis://redis:6379/0"]
    deploy:
      replicas: 1   # partner APIs are rate-limited; do not scale without checking
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend (Vite dev server — dev profile only) ─────────────────────────
  frontend:
    profiles: ["dev"]
    build:
      context: frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8001

  # ── Frontend (nginx-served production build; proxies /health,/api to api) ─
  frontend-prod:
    profiles: ["prod"]
    build:
      context: frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    restart: unless-stopped
    ports:
      # Host-side port is overridable per-deploy (some hosts already have
      # something on 80) — container's nginx always listens on 80 internally.
      - "${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
